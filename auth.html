<!DOCTYPE html>
<html>
<head>
  <title>ChatterBox Login</title>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbcH_OAGxFrfxPRarAnY4PUdAdz-rjymE",
      authDomain: "chat-ad084.firebaseapp.com",
      databaseURL: "https://chat-ad084-default-rtdb.firebaseio.com",
      projectId: "chat-ad084",
      storageBucket: "chat-ad084.firebasestorage.app",
      messagingSenderId: "703998786296",
      appId: "1:703998786296:web:99cabe960b1b00dd1d990d",
      measurementId: "G-MEVR8MCS49"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial;
    }

    #card {
      background: white;
      padding: 40px;
      width: 400px;
      border-radius: 15px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    #card h1 {
      margin: 0;
      font-size: 36px;
    }

    input {
      padding: 14px;
      font-size: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 100%;
    }

    button {
      padding: 14px;
      font-size: 22px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #4da6ff;
      color: white;
      width: 100%;
    }

    button:hover {
      background: #3399ff;
    }

    #usernameSection {
      display: none;
      margin-top: 10px;
      text-align: center;
    }

    #usernameSection input {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div id="card">
    <h1>ChatterBox</h1>

    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password" type="password">

    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Log In</button>

    <div id="usernameSection">
      <input id="username" placeholder="Choose a username">
      <button id="saveUsernameBtn">Save Username</button>
    </div>
  </div>

  <script>
    // SIGN UP
    document.getElementById("signupBtn").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        document.getElementById("usernameSection").style.display = "block";
      } catch (err) {
        alert("Signup error: " + err.message);
      }
    };

    // SAVE USERNAME
    document.getElementById("saveUsernameBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const uid = auth.currentUser.uid;

      if (!username) {
        alert("Username cannot be empty.");
        return;
      }

      const q = db.collection("users").where("username", "==", username);
      const snap = await q.get();

      if (!snap.empty) {
        alert("Username already taken.");
        return;
      }

      await db.collection("users").doc(uid).set({
        uid,
        email: auth.currentUser.email,
        username
      });

      localStorage.setItem("username", username);
      localStorage.setItem("email", auth.currentUser.email);

      window.location.href = "index.html";
    };

    // LOGIN
    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const userCred = await auth.signInWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;

        const userDoc = await db.collection("users").doc(uid).get();

        if (!userDoc.exists()) {
          document.getElementById("usernameSection").style.display = "block";
        } else {
          localStorage.setItem("username", userDoc.data().username);
          localStorage.setItem("email", auth.currentUser.email);

          window.location.href = "index.html";
        }
      } catch (err) {
        alert("Login error: " + err.message);
      }
    };
  </script>

</body>
</html>
