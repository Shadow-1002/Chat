<!DOCTYPE html>
<html>
<head>
  <title>ChatterBox</title>

  <!-- Firebase core -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbcH_OAGxFrfxPRarAnY4PUdAdz-rjymE",
      authDomain: "chat-ad084.firebaseapp.com",
      databaseURL: "https://chat-ad084-default-rtdb.firebaseio.com",
      projectId: "chat-ad084",
      storageBucket: "chat-ad084.firebasestorage.app",
      messagingSenderId: "703998786296",
      appId: "1:703998786296:web:99cabe960b1b00dd1d990d",
      measurementId: "G-MEVR8MCS49"
    };

    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body { 
      font-family: Arial; 
      margin: 0; 
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: row; /* sidebar + chat */
    }

    /* SIDEBAR */
    #sidebar {
      width: 250px;
      background: #333;
      color: white;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
    }

    #sidebar h2 {
      margin: 0;
      font-size: 32px;
    }

    #sidebar button {
      padding: 12px;
      font-size: 22px;
      border: none;
      border-radius: 8px;
      background: #4da6ff;
      color: white;
      cursor: pointer;
    }

    #sidebar button:hover {
      background: #3399ff;
    }

    /* CHAT AREA */
    #chatArea {
      margin-left: 250px; /* make space for sidebar */
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: calc(100% - 250px);
    }

    #title {
      font-size: 60px;
      text-align: center;
      margin: 10px 0;
    }

    #messages {
      flex: 1;
      border: 1px solid #ccc;
      overflow-y: scroll;
      padding: 10px;
      font-size: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 15px;
      word-wrap: break-word;
      display: inline-block;
    }

    .me {
      background-color: #4da6ff;
      color: white;
      align-self: flex-end;
    }

    .other {
      background-color: #e6e6e6;
      color: black;
      align-self: flex-start;
    }

    #inputRow {
      display: flex;
      padding: 10px;
      gap: 10px;
      align-items: center;
    }

    #input {
      width: 100%;
      padding: 14px 16px;
      font-size: 30px;
      border-radius: 10px;
    }

    button {
      padding: 14px 26px;
      font-size: 30px;
      border-radius: 10px;
    }

    #addFriendBox {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#friendSearchInput {
  padding: 10px;
  font-size: 20px;
  border-radius: 6px;
  width: 100%;
}

#friendsList {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.friendItem {
  background: #444;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 20px;
}

.friendItem:hover {
  background: #555;
}
  </style>

</head>

<body>

  <!-- FIXED LEFT SIDEBAR -->
 <!-- FIXED LEFT SIDEBAR -->
<div id="sidebar">
  <h2>Menu</h2>

  <button onclick="logout()">Logout</button>
  <button onclick="clearChat()">Clear Chat</button>

  <!-- ADD FRIEND SECTION -->
  <div id="addFriendBox">
    <input id="friendSearchInput" placeholder="Search username">
    <button onclick="addFriend(localStorage.getItem('username'), document.getElementById('friendSearchInput').value.trim())">
      Add Friend
    </button>
  </div>

  <h3>Your Friends</h3>
  <div id="friendsList"></div>
</div>

  <!-- CHAT AREA -->
  <div id="chatArea">
    <h1 id="title">ChatterBox</h1>

    <div id="messages"></div>

    <div id="inputRow">
      <input id="input" placeholder="Type a message">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
