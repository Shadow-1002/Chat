      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    /* MIDDLE SECTION (equal height) */
    #middleSections {
      flex: 1; /* THIS is the fix */
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
      overflow: hidden; /* prevents overflow pushing bottom buttons */

    .section {
      flex: 1; /* equal height */

      flex-direction: column;

    .sectionHeader {
      font-size: 22px;

    }

      height: 1px;
      background: #777;

    }

    .sectionContent {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      min-height: 0; /* REQUIRED for scroll */
    }

    /* CHAT & FRIEND ITEMS */
    .friendItem,
    .chatItem {
      background: #444;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
    }

    .friendItem:hover,
    .chatItem:hover {
      background: #555;
    }

    .activeChat {
      background: #777 !important;
      color: white;
    }

    /* BOTTOM BUTTONS */
    #bottomButtons {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    #sidebar button {
      padding: 12px;
      font-size: 22px;
      border: none;
      border-radius: 8px;
      background: #4da6ff;
      color: white;
      cursor: pointer;
    }

    #sidebar button:hover {
      background: #3399ff;
    }

    /* POPUP */
    #popupBox {
      position: absolute;
      background: #222;
      color: white;
      padding: 15px;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 180px;
      z-index: 999;
    }

    #popupBox button {
      font-size: 18px;
      padding: 8px;
      border-radius: 6px;
      background: #4da6ff;
      border: none;
      cursor: pointer;
    }

    #popupBox button:hover {
      background: #3399ff;
    }

    /* CHAT AREA */
    #chatArea {
      margin-left: 250px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: calc(100% - 250px);

      font-size: 60px;
      text-align: center;
      margin: 10px 0;
    }

      flex: 1;

      padding: 10px;
      font-size: 30px;

      flex-direction: column;

      word-wrap: break-word;
      display: inline-block;
    }

    .me {
      background-color: #4da6ff;
      color: white;
      align-self: flex-end;
    }

    .other {
      background-color: #e6e6e6;
      color: black;
      align-self: flex-start;
    }

    /* INPUT ROW */
    #inputRow {
      display: flex;
      padding: 10px;
      gap: 10px;
      align-items: center;
    }

    #input {
      width: 100%;
      padding: 14px 16px;
      font-size: 30px;
      border-radius: 10px;
    }

    #inputRow button {
      padding: 14px 26px;
      font-size: 30px;
      border-radius: 10px;
    }
