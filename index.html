<!DOCTYPE html>
<html>
<head>
  <title>ChatterBox</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbcH_OAGxFrfxPRarAnY4PUdAdz-rjymE",
      authDomain: "chat-ad084.firebaseapp.com",
      databaseURL: "https://chat-ad084-default-rtdb.firebaseio.com",
      projectId: "chat-ad084",
      storageBucket: "chat-ad084.firebasestorage.app",
      messagingSenderId: "703998786296",
      appId: "1:703998786296:web:99cabe960b1b00dd1d990d",
      measurementId: "G-MEVR8MCS49"
    };

    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f2f2f2;
    }

    #messages {
      height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 20px;
    }

    .bubble {
      padding: 12px 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      max-width: 70%;
      font-size: 20px;
    }

    .me {
      background: #4da6ff;
      color: white;
      margin-left: auto;
    }

    .other {
      background: #e0e0e0;
      color: black;
      margin-right: auto;
    }

    #inputBar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      background: white;
      box-shadow: 0px -2px 5px rgba(0,0,0,0.1);
    }

    #input {
      flex: 1;
      padding: 14px;
      font-size: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    #sendBtn {
      margin-left: 10px;
      padding: 14px 20px;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      background: #4da6ff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="messages"></div>

  <div id="inputBar">
    <input id="input" placeholder="Type a message...">
    <button id="sendBtn">Send</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
