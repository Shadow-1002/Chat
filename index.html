      flex-direction: column;

    }

    .me {
      background-color: #4da6ff;

  padding: 14px 26px;   /* matches input height */

  /* PAGE LAYOUT */
body {
  display: flex;
  margin: 0;
  height: 100vh;
  font-family: Arial;
}

#sidebar {
  width: 250px;
  background: #222;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

#sidebar h2 {
  margin: 0 0 10px 0;
  font-size: 28px;
}

.sideBtn {
  background: #444;
  color: white;
  border: none;
  padding: 12px;
  font-size: 20px;
  border-radius: 8px;
  text-align: left;
  cursor: pointer;
}

.sideBtn:hover {

}

/* CHAT AREA */
#chatContainer {
  flex: 1;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: scroll;
  padding: 10px;
  display: flex;
  flex-direction: column;

  <h1 id="title">ChatterBox</h1>

  <div id="messages"></div>

<div id="sidebar">

<div id="chatContainer">

    <button onclick="sendMessage()">Send</button>
  </div>
</div>
